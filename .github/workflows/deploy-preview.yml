name: Deploy preview

# Every push to a pull request from this repository: apply D1 migrations to track-preview, make the first
# Admin if there is none, deploy the preview Worker and comment its address on the PR. Never touches
# production. ONLY runs when the repository variable DEPLOY_ENABLED is 'true' and the Cloudflare secrets
# exist, and never for pull requests from forks. The CI workflow runs the checks and Playwright tests.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# One preview environment is shared by all PRs; the last deploy wins. Don't cancel a deploy midway.
concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check the Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::DEPLOY_ENABLED is true but CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing. Nothing was deployed."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
      - name: Check the placeholders are filled in
        run: |
          if grep -nE 'REPLACE_WITH_|example\.com' wrangler.jsonc | grep -vE '^[0-9]+:\s*//'; then
            echo "::error::wrangler.jsonc still has placeholders (above). See 'Fill in the placeholders' in the README."
            exit 1
          fi
      - run: npx vite build
      - name: Apply D1 migrations (track-preview)
        run: npx wrangler d1 migrations apply track-preview --remote --env preview
      - name: Make the first Admin (only if there isn't one)
        env:
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
        run: |
          if [ -z "$ADMIN_EMAIL" ]; then
            echo "::warning::The ADMIN_EMAIL variable is not set, so no first Admin was added."
            exit 0
          fi
          node scripts/admin-sql.mjs "$ADMIN_EMAIL" > admin.sql
          npx wrangler d1 execute track-preview --remote --env preview --yes --file admin.sql
      - name: Deploy Worker (preview)
        run: npx wrangler deploy --env preview
      - name: Comment the preview address on the PR
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
        with:
          script: |
            const marker = '<!-- track-preview-deploy -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const where = process.env.PREVIEW_URL || 'your preview address';
            const body = [
              marker,
              `**Preview deployed:** ${where}`,
              ``,
              `Commit \`${sha}\` · migrations applied to \`track-preview\` · ${new Date().toISOString()}`,
              ``,
              `_The preview Worker and database are shared by all open PRs; the most recent deploy is what's live._`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
