name: Refresh preview from production

# Manual only. Copies production data INTO preview, never the other way:
#   1. export track-prod (read-only) and order it parents-first
#   2. drop every table in track-preview
#   3. load the export into track-preview
#   4. apply any pending migrations to track-preview
# The only command that names production is the read-only export. Every write names
# track-preview and --env preview explicitly, and a guard step checks this file before running.
# Only runs when the repository variable DEPLOY_ENABLED is 'true' and the Cloudflare secrets exist.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "refresh preview" to replace ALL preview data with a copy of production'
        required: true

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check confirmation
        if: ${{ inputs.confirm != 'refresh preview' }}
        run: |
          echo "::error::Confirmation text did not match. Nothing was changed."
          exit 1
      - name: Check the Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing. Nothing was changed."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Guard - production is only ever read
        run: |
          # Any line mentioning production/track-prod must be the read-only export.
          bad=$(grep -nE 'track-prod|--env production' .github/workflows/refresh-preview.yml \
            | grep -vE '^[0-9]+:\s*#' | grep -v 'd1 export track-prod' | grep -v "grep" || true)
          if [ -n "$bad" ]; then echo "::error::Unexpected production reference:"; echo "$bad"; exit 1; fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Export production (read-only)
        run: |
          npx wrangler d1 export track-prod --remote --env production --output prod-export.sql
          test -s prod-export.sql
          echo "Exported $(wc -l < prod-export.sql) lines"
          # Parents before children, so foreign keys resolve while loading.
          node scripts/order-d1-export.mjs prod-export.sql > prod-export-ordered.sql

      - name: Build preview reset SQL
        run: |
          npx wrangler d1 execute track-preview --remote --env preview --json --command \
            "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" \
            > preview-tables.json
          node scripts/preview-reset-sql.mjs preview-tables.json > preview-reset.sql
          cat preview-reset.sql

      - name: Reset preview (drop all tables)
        run: npx wrangler d1 execute track-preview --remote --env preview --yes --file preview-reset.sql

      - name: Load production export into preview
        run: npx wrangler d1 execute track-preview --remote --env preview --yes --file prod-export-ordered.sql

      - name: Apply pending migrations to preview
        run: npx wrangler d1 migrations apply track-preview --remote --env preview

      - name: Summary
        run: |
          npx wrangler d1 execute track-preview --remote --env preview --command \
            "SELECT (SELECT count(*) FROM users) AS users, (SELECT count(*) FROM entries) AS entries, (SELECT version FROM sync_state) AS version"
